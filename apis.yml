name: Butn
kind: company
description: >-
  Butn is an Australian embedded-finance company that funds business cashflow at
  the point of transaction, plugging invoice finance, outsourced credit terms,
  and supplier "pay now, settle later" directly into the platforms its business
  customers already use. Its funding products — Butn X (invoice finance to draw
  cash early against receivables), Butn Terms (outsourced buyer credit where Butn
  carries the risk), and Butn Pay (paying suppliers upfront in exchange for
  extended repayment) — are designed to be embedded into partner marketplaces,
  accounting tools, and B2B platforms such as MYOB, Salesforce, and FoodByUs
  rather than sold as a standalone destination. Butn sits in the spend / accounts
  payable and accounts receivable financing layer of Australia's payments market,
  where money movement rides the New Payments Platform and the banks opened by
  the Consumer Data Right. Its integration and embedding are delivered through
  private, partner-provisioned APIs: Butn markets "plug and play" embedding for
  partners but does not operate a public self-serve developer portal, publish
  downloadable OpenAPI/Swagger definitions, or expose openly documented API
  reference material as of this profile.
