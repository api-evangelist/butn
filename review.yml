aid: butn
name: Butn
review:
  question: Does Butn operate a public, self-serve developer portal with downloadable API specifications?
  answer: false
  date: '2026-07-24'
  reviewer: API Evangelist
findings:
  summary: |
    Butn is an Australian embedded-finance provider (invoice finance, outsourced
    credit terms, and supplier "pay now" via its Butn X, Butn Terms, and Butn Pay
    products) whose home market is Australia. It markets itself to platform
    partners as "plug and play" embeddable funding, which implies partner-facing
    integration APIs, but it does NOT expose a public developer surface. No
    developer/docs/api subdomain resolves and no documentation path is published:
    developer.butn.co, developers.butn.co, docs.butn.co, and api.butn.co all fail
    to resolve (DNS/connection failure, curl exit — no HTTP response), and
    www.butn.co/developers, /docs, /api, and /api-docs all return HTTP 404. The
    primary domain butn.com.au 301-redirects to the canonical marketing site
    https://www.butn.co/ (HTTP 200), which is a Webflow-hosted brochure site with
    no API reference, no interactive console, and no download links. No
    downloadable OpenAPI/Swagger/Postman/GraphQL/gRPC artifact was found anywhere,
    so none were harvested (0 specs). Authentication model, webhook/event catalog,
    and any ISO 20022 posture are not publicly documented because there is no
    public API program; access to Butn's technology is provisioned to integration
    partners privately rather than through open onboarding. Third-party directory
    API Tracker (apitracker.io/a/butn-co) corroborates this: it categorizes Butn
    under Business Lending / B2B BNPL and lists API style, docs, auth, webhooks,
    sandbox, rate limits, and OpenAPI all as unavailable.
  homeMarket: Australia
  developerPortal:
    url: ""
    confirmed: false
    note: No developer portal located; all probed developer/docs/api hosts and paths failed to resolve or returned 404.
