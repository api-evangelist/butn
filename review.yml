    - url: https://developers.butn.co
      status: 000
      note: Does not resolve (no HTTP response).
    - url: https://docs.butn.co
      status: 000
      note: Does not resolve (no HTTP response).
    - url: https://api.butn.co
      status: 000
      note: Does not resolve (no HTTP response).
    - url: https://www.butn.co/developers
      status: 404
    - url: https://www.butn.co/docs
      status: 404
    - url: https://www.butn.co/api
      status: 404
    - url: https://www.butn.co/api-docs
      status: 404
  specsHarvested: 0
  authModel: Not publicly documented (no public API program; partner-provisioned integration only).
  webhooks: Not publicly documented.
  postman: None found.
  graphql: None found.
  iso20022: Not applicable / not documented — Butn is a financing layer over Australian rails, not a scheme or clearing operator, and publishes no scheme documentation.
  transports:
    - protocol: HTTPS
      scheme: https
      documented: false
      note: Marketing site only; no documented API transport, base URL, or endpoints are published.
sources:
  - url: https://www.butn.co/
    type: Website
    note: Canonical marketing site (Webflow); describes embedded funding products but no API reference.
  - url: https://www.butn.co/funding-solutions
    type: Documentation
    note: Product/funding-solutions overview (Butn X, Butn Terms, Butn Pay).
