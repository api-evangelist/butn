actions:
  apisYmlUpdated: true
  reason: |
    Bootstrap identity captured with an empty apis[] block because Butn publishes
    no public, documented API and no downloadable specification could be
    harvested. Classified as built-stub: real company identity and honest API
    posture recorded; no fabricated hosts, specs, endpoints, or scopes.
